name: Sincronizar Steam

# O plano Hobby da Vercel só permite cron 1x por dia. Este workflow chama o mesmo
# endpoint de hora em hora; ele só sincroniza quem está "vencido" (ver
# src/lib/steam/schedule.ts), então quem joga muito é atualizado a cada ~3 h.
#
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      URL pública do site, a mesma que abre no navegador (ex.: https://gamelogwaras.vercel.app)
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET na Vercel
on:
  schedule:
    - cron: "17 * * * *" # minuto 17: foge do pico do minuto 0 no GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/steam-sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Defina os segredos APP_URL e CRON_SECRET para ativar a sincronização de hora em hora."
            exit 0
          fi
          out=$(mktemp)
          code=$(curl --silent --show-error --max-time 90 -o "$out" -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/steam-sync") || code=000
          cat "$out"; echo
          case "$code" in
            2*) ;;
            404) echo "::error::APP_URL ($APP_URL) não tem o site (404 da Vercel). Use o endereço que abre o site, ex.: https://gamelogwaras.vercel.app"; exit 1 ;;
            401) echo "::error::CRON_SECRET daqui é diferente do CRON_SECRET da Vercel."; exit 1 ;;
            *) echo "::error::O site respondeu $code. Se o banco estiver fora (Supabase pausado), o site inteiro cai."; exit 1 ;;
          esac
