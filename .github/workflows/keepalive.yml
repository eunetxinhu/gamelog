name: Manter o Supabase acordado

# No plano grátis o Supabase PAUSA o projeto depois de ~1 semana com pouca atividade
# (foi o que derrubou o site em nov/2026). Este workflow faz duas chamadas pela API do
# Supabase todo dia, o que conta como atividade, e falha (e-mail do GitHub) se o
# projeto não responder — aí é só entrar no painel do Supabase e clicar em "Resume".
#
# Configure em Settings → Secrets and variables → Actions:
#   SUPABASE_URL              o mesmo NEXT_PUBLIC_SUPABASE_URL da Vercel (https://<ref>.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  o mesmo NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY da Vercel (chave pública)
on:
  schedule:
    - cron: "41 11 * * *" # 08h41 de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$KEY" ]; then
            echo "::error::Defina os segredos SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (os mesmos NEXT_PUBLIC_ da Vercel). Sem eles o Supabase pode pausar o projeto de novo."
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          host="${base#https://}"
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::$host não existe mais no DNS: o projeto do Supabase está PAUSADO. Entre em supabase.com/dashboard, abra o projeto e clique em Resume project."
            exit 1
          fi
          for path in /auth/v1/health /rest/v1/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "apikey: $KEY" "$base$path")
            echo "$path → HTTP $code"
            case "$code" in
              2*|401|404) ;; # respondeu (401/404 sem permissão também é atividade)
              *) echo "::error::O Supabase respondeu $code em $path. Confira o painel (projeto pausado ou fora do ar?)."; exit 1 ;;
            esac
          done
