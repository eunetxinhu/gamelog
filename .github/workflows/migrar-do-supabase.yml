name: Migrar do Supabase

# Copia tudo do Supabase para a Neon (banco) e o Cloudflare R2 (fotos), uma vez só.
# Rode primeiro com "simular" marcado: faz tudo, confere e desfaz no fim.
#
# Segredos (Settings → Secrets and variables → Actions). Pode apagar todos depois:
#   ORIGEM_DB_URL               Supabase → Connect → "Session pooler" (porta 5432)
#   ORIGEM_SUPABASE_URL         https://<ref>.supabase.co
#   ORIGEM_SUPABASE_SECRET_KEY  Supabase → Project Settings → API Keys → Secret keys
#   DESTINO_DB_URL              Neon → Connect, SEM "Connection pooling" (host sem "-pooler")
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL
#
# O script recusa rodar se a Neon já tiver dados (para não duplicar nada).
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (desfaz tudo no fim, não envia fotos)"
        type: boolean
        default: true
      sem_fotos:
        description: "Pular as fotos (só o banco)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrar-do-supabase
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORIGEM_DB_URL: ${{ secrets.ORIGEM_DB_URL }}
      ORIGEM_SUPABASE_URL: ${{ secrets.ORIGEM_SUPABASE_URL }}
      ORIGEM_SUPABASE_SECRET_KEY: ${{ secrets.ORIGEM_SUPABASE_SECRET_KEY }}
      DESTINO_DB_URL: ${{ secrets.DESTINO_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir segredos
        run: |
          missing=""
          for k in ORIGEM_DB_URL DESTINO_DB_URL; do [ -z "${!k}" ] && missing="$missing $k"; done
          if [ "${{ inputs.sem_fotos }}" != "true" ]; then
            for k in ORIGEM_SUPABASE_URL ORIGEM_SUPABASE_SECRET_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_URL; do
              [ -z "${!k}" ] && missing="$missing $k"
            done
          fi
          if [ -n "$missing" ]; then echo "::error::Faltam os segredos:$missing"; exit 1; fi
          case "$DESTINO_DB_URL" in *-pooler*) echo "::error::DESTINO_DB_URL tem que ser a conexão direta da Neon (sem -pooler)."; exit 1 ;; esac

      - name: Criar as tabelas na Neon (prisma migrate deploy)
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DESTINO_DB_URL }}

      - name: Copiar
        run: |
          flags=""
          [ "${{ inputs.simular }}" = "true" ] && flags="$flags --simular"
          [ "${{ inputs.sem_fotos }}" = "true" ] && flags="$flags --sem-fotos"
          npx tsx scripts/migrar-do-supabase.mts $flags
